spring:
  application:
    name: cinescore

  profiles:
    active: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false

  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=30m

tmdb:
  api:
    base-url: https://api.themoviedb.org/3
    image-url: https://image.tmdb.org/t/p/w500

jwt:
  expiration: 86400000

cors:
  allowed-origins: http://localhost:5173
